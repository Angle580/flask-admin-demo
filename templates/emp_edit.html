{% extends 'base.html' %}
{% block title %}编辑员工{% endblock %}
{% block body %}
<h1>编辑员工 #{{ emp.id }}</h1>
<form method="post" enctype="multipart/form-data" class="edit-form">
  <input type="hidden" name="old_avatar" value="{{ emp.avatar or '' }}">
  <label>姓名 <input name="name" value="{{ emp.name }}" required></label>
  <label>部门 <input name="department" value="{{ emp.department }}" required></label>
  <label>职位 <input name="position" value="{{ emp.position }}" required></label>
  <label>薪资 <input name="salary" type="number" step="0.01" value="{{ emp.salary }}" required></label>
  <label>邮箱 <input name="email" value="{{ emp.email or '' }}"></label>
  <label>当前头像
    {% if emp.avatar %}<img src="{{ url_for('static', filename='uploads/' + emp.avatar) }}" class="avatar">{% endif %}
    <input type="file" name="avatar" accept="image/*">
  </label>
  <button type="submit">保存</button>
  <a href="{{ url_for('employees') }}">取消</a>
</form>
{% endblock %}
